name: Deploy AppGyver Web to Firebase Hosting

on:
  push:
    branches:
      - main  # Aciona o deploy quando houver push na branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Configure Firebase credentials
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        export_default_credentials: true

    - name: Deploy to Firebase Hosting
      run: firebase deploy --only hosting --project acampdeep
